experiment:
  cv_folds: 20
  datasets:
  - iris
  - wine
  - breast_cancer
  - digits
  - heart
  - ionosphere
  - banknote
  - vehicle
  random_state: 42
fitness:
  classification_metric: accuracy
  interpretability_weights:
    feature_coherence: 0.1
    node_complexity: 0.5
    semantic_coherence: 0.3
    tree_balance: 0.1
  mode: weighted_sum
  weights:
    accuracy: 0.8
    interpretability: 0.2
ga:
  crossover_prob: 0.72
  early_stopping_rounds: 20
  elitism_ratio: 0.12
  mutation_prob: 0.18
  mutation_types:
    expand_leaf: 0.05
    feature_replacement: 0.25
    prune_subtree: 0.25
    threshold_perturbation: 0.45
  n_generations: 100
  population_size: 200
  tournament_size: 3
tree:
  max_depth: 6
  min_samples_leaf: 3
  min_samples_split: 8

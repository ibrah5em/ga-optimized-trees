experiment:
  cv_folds: 20
  datasets:
  - dresses_sales
  - kc2
  - climate_crashes
  - wdbc
  - ilpd
  - balance_scale
  - credit_approval
  - breast_w
  - eucalyptus
  - blood_transfusion
  - diabetes_pima
  - analcatdata_dmft
  - vehicle
  - tic_tac_toe
  - vowel
  - credit_g
  - qsar_biodeg
  - pc1
  - banknote
  - pc4
  random_state: 42
fitness:
  classification_metric: accuracy
  interpretability_weights:
    feature_coherence: 0.1
    node_complexity: 0.5
    semantic_coherence: 0.3
    tree_balance: 0.1
  mode: weighted_sum
  validation_fraction: 0.2
  weights:
    accuracy: 0.68
    interpretability: 0.32
ga:
  crossover_prob: 0.72
  elitism_ratio: 0.12
  mutation_prob: 0.18
  mutation_types:
    expand_leaf: 0.05
    feature_replacement: 0.25
    prune_subtree: 0.25
    threshold_perturbation: 0.45
  n_generations: 40
  population_size: 80
  tournament_size: 3
tree:
  growth_stop_prob: 0.3
  max_depth: 6
  min_samples_leaf: 3
  min_samples_split: 8
  repair_constraints: true
  split_strategy: midpoint

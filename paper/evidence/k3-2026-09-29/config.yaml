ga:
  population_size: 80
  n_generations: 40
  crossover_prob: 0.72
  mutation_prob: 0.18
  tournament_size: 3
  elitism_ratio: 0.12
  mutation_types:
    threshold_perturbation: 0.45
    feature_replacement: 0.25
    prune_subtree: 0.25
    expand_leaf: 0.05
tree:
  max_depth: 6
  min_samples_split: 8
  min_samples_leaf: 3
  growth_stop_prob: 0.3
  split_strategy: midpoint
fitness:
  mode: weighted_sum
  validation_fraction: 0.2
  classification_metric: accuracy
  weights:
    accuracy: 0.68
    interpretability: 0.32
  interpretability_weights:
    node_complexity: 0.5
    feature_coherence: 0.1
    tree_balance: 0.1
    semantic_coherence: 0.3
experiment:
  datasets:
  - dresses_sales
  - kc2
  - climate_crashes
  - wdbc
  - ilpd
  - balance_scale
  - credit_approval
  - breast_w
  - eucalyptus
  - blood_transfusion
  - diabetes_pima
  - analcatdata_dmft
  - vehicle
  - tic_tac_toe
  - vowel
  - credit_g
  - qsar_biodeg
  - pc1
  - banknote
  - pc4
  cv_folds: 20
  random_state: 42

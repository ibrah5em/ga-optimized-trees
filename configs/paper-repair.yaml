# =============================================================================
# Sensitivity variant of configs/paper.yaml — identical except that
# tree.repair_constraints is on (Phase 2 item 4, src/ga_trees/ga/repair.py).
#
# Written 2026-09-29, AFTER K1/K2 were observed. It may only be reported as a
# sensitivity analysis next to the pre-registered result, never in place of it
# (logged as a deviation from the pre-registered protocol).
# =============================================================================

# Genetic Algorithm Parameters
ga:
  population_size: 80
  n_generations: 40
  crossover_prob: 0.72
  mutation_prob: 0.18
  tournament_size: 3
  elitism_ratio: 0.12

  mutation_types:
    threshold_perturbation: 0.45
    feature_replacement: 0.25
    prune_subtree: 0.25
    expand_leaf: 0.05

# Tree Constraints
tree:
  max_depth: 6
  min_samples_split: 8
  min_samples_leaf: 3
  growth_stop_prob: 0.3  # P(stop growing) per node when seeding the population
  split_strategy: midpoint  # 'midpoint' = observed split points, 'uniform' = pre-Phase-2 draw
  repair_constraints: true  # collapse splits that break min_samples_* after variation

# Fitness Function
fitness:
  mode: weighted_sum
  validation_fraction: 0.2  # held out from the fitting data to score fitness on;
                            # 0.0 restores resubstitution fitness
  classification_metric: accuracy    # 'accuracy', 'f1_macro', 'f1_weighted', 'balanced_accuracy'
  weights:
    accuracy: 0.68
    interpretability: 0.32

  interpretability_weights:
    node_complexity: 0.50
    feature_coherence: 0.10
    tree_balance: 0.10
    semantic_coherence: 0.30

# Experiment Settings
experiment:
  # The pre-registered CC-18 selection (DatasetLoader.CC18_BENCHMARK).
  # Do not edit without recording a deviation in that file.
  datasets:
    - dresses_sales
    - kc2
    - climate_crashes
    - wdbc
    - ilpd
    - balance_scale
    - credit_approval
    - breast_w
    - eucalyptus
    - blood_transfusion
    - diabetes_pima
    - analcatdata_dmft
    - vehicle
    - tic_tac_toe
    - vowel
    - credit_g
    - qsar_biodeg
    - pc1
    - banknote
    - pc4
  cv_folds: 20
  random_state: 42

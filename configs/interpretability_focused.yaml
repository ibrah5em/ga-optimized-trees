# =============================================================================
# Interpretability-Focused Configuration - Maximize model transparency
# Strong emphasis on small, simple trees for explainability
# =============================================================================

ga:
  population_size: 80
  n_generations: 40
  crossover_prob: 0.7
  mutation_prob: 0.25
  tournament_size: 3
  elitism_ratio: 0.1

  mutation_types:
    threshold_perturbation: 0.35
    feature_replacement: 0.2
    prune_subtree: 0.4
    expand_leaf: 0.05

tree:
  max_depth: 5
  min_samples_split: 12
  min_samples_leaf: 5
  growth_stop_prob: 0.3  # P(stop growing) per node when seeding the population
  split_strategy: midpoint  # 'midpoint' = observed split points, 'uniform' = pre-Phase-2 draw

fitness:
  mode: weighted_sum
  validation_fraction: 0.2  # held out from the fitting data to score fitness on;
                            # 0.0 restores resubstitution fitness
  weights:
    accuracy: 0.4
    interpretability: 0.6

  interpretability_weights:
    node_complexity: 0.7
    feature_coherence: 0.15
    tree_balance: 0.1
    semantic_coherence: 0.05

experiment:
  datasets:
    - iris
    - wine
    - breast_cancer
  cv_folds: 10
  random_state: 42

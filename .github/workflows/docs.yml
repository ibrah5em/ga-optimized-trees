name: Deploy docs

# Publishes the MkDocs site to the gh-pages branch on every push to main that
# touches the docs. The site used to be deployed by hand, and it kept showing
# benchmark claims months after they were withdrawn from the repository.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install MkDocs
      run: pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0"

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Deploy
      run: |
        mkdocs gh-deploy --force --strict --message "docs: deploy {sha}"
